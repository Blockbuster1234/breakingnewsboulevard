<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Breaking News Boulevard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fafafa; color: #222; margin: 0; }
    h1 { color: #1a1a2e; margin: 0; padding: 20px; background: #fff; border-bottom: 3px solid #e74c3c; }
    h1 span { font-size: 0.6em; color: #999; display: block; margin-top: 4px; }
    #posts-container { max-width: 820px; margin: 0 auto; padding: 20px; }
    .post-card { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
    .post-card h2 { font-size: 1.3em; margin: 0 0 8px; }
    .post-card h2 a { color: #1a1a2e; text-decoration: none; }
    .post-card h2 a:hover { color: #e74c3c; }
    .post-meta { font-size: 0.85em; color: #7f8c8d; margin-bottom: 10px; }
    .category-tag { background: #e74c3c; color: #fff; padding: 2px 8px; border-radius: 10px; font-size: 0.75em; text-transform: uppercase; }
    .post-excerpt { color: #555; margin-bottom: 10px; }
    .post-img { width: 100%; height: 180px; object-fit: cover; border-radius: 6px; margin-bottom: 10px; }
    .read-more { color: #e74c3c; font-weight: bold; text-decoration: none; }
    .post-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 600px) { .post-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>Breaking News Boulevard <span>Latest news from around the world</span></h1>
  <div id="posts-container"></div>
  <script src="js/posts.js"></script>
  <script>
    const container = document.getElementById('posts-container');
    const grid = document.createElement('div');
    grid.className = 'post-grid';
    posts.forEach(post => {
      const firstImg = post.images && post.images.length > 0 ? post.images[0] : '';
      const card = document.createElement('article');
      card.className = 'post-card';
      card.innerHTML = `
        ${firstImg ? `<img class="post-img" src="${firstImg}" alt="${post.title}">` : ''}
        <div class="post-meta">
          <span class="date">${post.date}</span> | <span class="category-tag">${post.category || ''}</span>
        </div>
        <h2><a href="${post.url}">${post.title}</a></h2>
        <p class="post-excerpt">${post.excerpt}</p>
        <a class="read-more" href="${post.url}">Read more &rarr;</a>
      `;
      grid.appendChild(card);
    });
    container.appendChild(grid);
  </script>
</body>
</html>
