<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Breaking News Boulevard — Article</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #333; max-width: 800px; margin: 40px auto; padding: 20px; }
    h1 { color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; }
    .article-meta { color: #7f8c8d; font-size: 0.9em; margin: 20px 0; }
    .category-tag { background: #ecf0f1; padding: 2px 6px; border-radius: 3px; font-size: 0.8em; text-transform: uppercase; letter-spacing: 0.5px; }
    img { max-width: 100%; height: auto; border-radius: 8px; margin: 20px 0; }
    p { margin-bottom: 16px; }
  </style>
</head>
<body>
  <div id="article-container">
    <h1 id="title"></h1>
    <div class="article-meta" id="meta"><span id="category" class="category-tag"></span></div>
    <img id="hero-img" class="article-hero" src="" alt="">
    <div class="article-body" id="body"></div>
  </div>
</body>
</html>
