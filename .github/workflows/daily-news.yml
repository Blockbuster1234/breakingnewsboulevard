name: Daily AI News

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

defaults:
  run:
    working-directory: breakingnewsboulevard

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: breakingnewsboulevard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate today's stories
        run: npm run generate:daily

      - name: Commit and push
        run: |
          git config user.name "BNB News Bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "news: daily edition $(date -u +%F)"
          git push
