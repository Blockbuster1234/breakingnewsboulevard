name: Daily Autonomous News

on:
  schedule:
    - cron: '47 6 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'Anzahl der Entwürfe (1-6)'
        required: false
        default: '1'

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

defaults:
  run:
    working-directory: breakingnewsboulevard

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: breakingnewsboulevard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Legal readiness
        run: npm run legal:check || echo "::warning title=Rechtstexte::Impressum oder Datenschutz enthalten noch Platzhalter."

      - name: Generate daily drafts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FREE_TEXT_MODEL: openai
          FREE_IMAGE_MODEL: flux
        # Free Gemini quota is tight on GitHub's shared runners: scheduled runs publish one article.
        run: npm run generate:daily -- --count ${{ inputs.count || '1' }}

      - name: Auto-approve and publish
        env:
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH || 'true' }}
        run: npm run auto:publish

      - name: Validate published site
        run: npm test

      - name: Commit and push
        run: |
          git config user.name "Breaking News Boulevard Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/posts.json posts index.html js/posts.js sitemap.xml
          if git diff --cached --quiet; then
            echo "Keine Änderungen zu committen."
            exit 0
          fi
          git commit -m "Daily news: $(date -u +%F)"
          git push
