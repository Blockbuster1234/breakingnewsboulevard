name: Daily Autonomous News

on:
  schedule:
    # Alle 3 Stunden ein Versuch: der kostenlose KI-Dienst ist oft kurz
    # ueberlastet, mit mehreren Versuchen am Tag klappt es zuverlaessig.
    - cron: '47 5 * * *'
    - cron: '47 8 * * *'
    - cron: '47 11 * * *'
    - cron: '47 14 * * *'
    - cron: '47 17 * * *'
    - cron: '47 20 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'Anzahl der Entwuerfe (1-6, leer = automatisch)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

defaults:
  run:
    working-directory: breakingnewsboulevard

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: breakingnewsboulevard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Legal readiness
        run: npm run legal:check || echo "::warning title=Rechtstexte::Impressum oder Datenschutz enthalten noch Platzhalter."

      - name: Generate daily drafts
        continue-on-error: true
        env:
          # Bewusst KEIN GEMINI_API_KEY und KEIN GROQ_API_KEY:
          # es wird nur der kostenlose Text- und Bilddienst genutzt,
          # damit das kostenlose Google-Kontingent nicht verbraucht wird.
          FREE_TEXT_MODEL: openai
          FREE_IMAGE_MODEL: flux
        run: |
          COUNT="${{ inputs.count }}"
          if [ -z "$COUNT" ]; then COUNT=1; fi
          timeout 14m npm run generate:daily -- --count "$COUNT"

      - name: Auto-approve and publish
        env:
          AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH || 'true' }}
        run: npm run auto:publish

      - name: Build RSS feed
        continue-on-error: true
        run: npm run feed

      - name: Statische Startseite erzeugen
        continue-on-error: true
        run: node scripts/static-home.mjs

      - name: Validate published site
        run: npm test

      - name: Commit and push
        run: |
          git config user.name "Breaking News Boulevard Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/posts.json posts index.html js/posts.js sitemap.xml feed.xml
          if git diff --cached --quiet; then
            echo "Keine Aenderungen zu committen."
            exit 0
          fi
          git commit -m "Daily news: $(date -u +%F)"
          git push
